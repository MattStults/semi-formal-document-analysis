name: tests
on:
  push: { branches: [main] }
  pull_request: {}
jobs:
  semi-formal-experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.10" }
      - run: bash setup_env.sh
      - run: cd semi-formal-experiment && .venv/bin/python -m pytest -q
  walkthrough:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.10" }
      - run: bash setup_env.sh
      - run: cd walkthrough && ../semi-formal-experiment/.venv/bin/python -m pytest -q
  demo-path:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.10" }
      - run: bash setup_env.sh
      - run: |
          python3 engine/spec-cite/cite.py resolve 'model-spec@2025-12-18 > #avoid_sycophancy > ¶2 s1'
      - run: |
          python3 walkthrough/paper_pipeline/phase_1/resolve_runs/graph_v2/graph_check.py walkthrough/paper_pipeline/phase_1/resolve_runs/graph_v2/runs/ds7/root_graph.production.json
