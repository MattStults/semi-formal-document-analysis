<!-- ERROR-CALCULUS ROUTER — interactive state machine widget.
     Paste-able into a Jekyll/markdown post (inline script, no build step).
     Mirrors calculus_model.py / calculus.lp transitions exactly. -->
<div style="max-width:640px;margin:1.2em auto;font:14px/1.45 system-ui,sans-serif;border:1px solid rgba(128,128,128,.35);border-radius:10px;padding:14px">
  <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:8px">
    <strong style="margin-right:auto">Error-calculus router</strong>
    <span id="ec-presets"></span>
    <button id="ec-reset" style="padding:2px 10px;border-radius:6px;border:1px solid rgba(128,128,128,.4);cursor:pointer;font:inherit;background:transparent;color:inherit">reset</button>
  </div>
  <svg id="ec-svg" viewBox="0 0 620 300" style="width:100%;height:auto;display:block"></svg>
  <div id="ec-state" style="margin:8px 0 4px;font-size:13px;opacity:.85"></div>
  <div id="ec-branches" style="display:flex;gap:6px;flex-wrap:wrap;margin:6px 0"></div>
  <div id="ec-trace" style="font-size:12px;opacity:.7;margin-top:6px"></div>
</div>
<script>
(function(){
  var NS='http://www.w3.org/2000/svg';
  var svg=document.getElementById('ec-svg');
  var COST={r1:3,r2:1,r2b:2,r3:1,r3x:8,r4:5,r5:8,r5x:0};
  var LBL={r1:'R1 panel',r2:'R2 audit',r2b:'R2b retranslate',r3:'R3 delta',
           r3x:'R3x mint (missing intension)',r4:'R4 build consumer',r5:'R5 mint',r5x:'R5x exhaustion'};
  // state: {c:census, v, panel, aud, retr, built, mints, deltas, cost, done}
  var S, trace;
  function init(c){S={c:c,v:'unaudited',panel:0,aud:0,retr:0,built:0,mints:0,deltas:0,cost:0,done:null};trace=[];render();}
  function rule(){ // -> {r, branches:[{label, apply}]}
    if(S.done) return null;
    var s=S;
    function nb(label,f){return {label:label,apply:f};}
    if(!s.panel) return {r:'r1',branches:[
      nb('panel OVERTURNS → resolved (truth error)',function(){s.done='RESOLVED-T';}),
      nb('panel stands',function(){s.panel=1;})]};
    if(!s.aud) return {r:'r2',branches:[
      nb('translation faithful',function(){s.aud=1;s.v='faithful';}),
      nb('UNFAITHFUL found',function(){s.aud=1;s.v='unfaithful';})]};
    if(s.v==='unfaithful') return {r:'r2b',branches:[
      nb('retranslation resolves it',function(){s.done='RESOLVED-V';}),
      nb('persists → census SEP',function(){s.v='faithful';s.retr=1;s.c='SEP';}),
      nb('persists → REACH',function(){s.v='faithful';s.retr=1;s.c='REACH';}),
      nb('persists → UNSAT',function(){s.v='faithful';s.retr=1;s.c='UNSAT';})]};
    if(s.c==='SEP'){
      if(s.deltas<2) return {r:'r3',branches:[
        nb('delta validates → resolved',function(){s.done='RESOLVED-D';}),
        nb('fails / reverts (ledgered, budget −1)',function(){s.deltas++;})]};
      if(s.mints<2) return {r:'r3x',branches:[
        nb('minted concept separates → SEP',function(){s.mints++;s.deltas=0;s.c='SEP';}),
        nb('mint lands REACH (needs consumer)',function(){s.mints++;s.deltas=0;s.c='REACH';}),
        nb('mint fails → UNSAT',function(){s.mints++;s.deltas=0;s.c='UNSAT';})]};
      return {r:'r5x',branches:[
        nb('rule: terminal-by-document',function(){s.done='TERMINAL-DOC';}),
        nb('rule: defensible',function(){s.done='DEFENSIBLE';})]};
    }
    if(s.c==='REACH') return {r:'r4',branches:[
      nb('consumer built → SEP',function(){s.built=1;s.c='SEP';})]};
    if(s.c==='UNSAT'){
      if(s.mints<2) return {r:'r5',branches:[
        nb('mint separates → SEP',function(){s.mints++;s.deltas=0;s.c='SEP';}),
        nb('mint → REACH',function(){s.mints++;s.deltas=0;s.c='REACH';}),
        nb('mint fails → UNSAT',function(){s.mints++;s.deltas=0;s.c='UNSAT';})]};
      return {r:'r5x',branches:[
        nb('rule: terminal-by-document',function(){s.done='TERMINAL-DOC';}),
        nb('rule: defensible',function(){s.done='DEFENSIBLE';})]};
    }
    return null;
  }
  var NODES={r1:[70,40],r2:[70,110],r2b:[70,190],r3:[300,110],r3x:[300,190],
             r4:[300,40],r5:[480,110],r5x:[480,190],DONE:[480,260]};
  var EDGES=[['r1','r2'],['r2','r2b'],['r2','r3'],['r2b','r3'],['r3','r3x'],
             ['r4','r3'],['r3x','r4'],['r3x','r5x'],['r2','r5'],['r5','r3'],
             ['r5','r4'],['r5','r5x'],['r5x','DONE'],['r3','DONE'],['r1','DONE'],['r2b','DONE']];
  function el(n,a){var e=document.createElementNS(NS,n);for(var k in a)e.setAttribute(k,a[k]);return e;}
  function render(){
    svg.innerHTML='';
    var cur=rule();
    EDGES.forEach(function(p){var a=NODES[p[0]],b=NODES[p[1]];
      svg.appendChild(el('line',{x1:a[0],y1:a[1],x2:b[0],y2:b[1],stroke:'currentColor','stroke-opacity':.15}));});
    Object.keys(NODES).forEach(function(k){
      var p=NODES[k], active=cur&&cur.r===k, isDone=k==='DONE';
      var g=el('g',{});
      g.appendChild(el('rect',{x:p[0]-58,y:p[1]-16,width:116,height:32,rx:8,
        fill:active?'#3b82f6':(isDone&&S.done?'#16a34a':'transparent'),
        stroke:'currentColor','stroke-opacity':active?0:.4}));
      var t=el('text',{x:p[0],y:p[1]+4,'text-anchor':'middle','font-size':11,
        fill:(active||(isDone&&S.done))?'#fff':'currentColor'});
      t.textContent=isDone?(S.done||'terminal'):(LBL[k]+' ('+COST[k]+'u)');
      g.appendChild(t); svg.appendChild(g);
    });
    document.getElementById('ec-state').innerHTML=
      'census <b>'+S.c+'</b> · translation <b>'+S.v+'</b> · panel '+(S.panel?'✓':'—')+
      ' · audit '+(S.aud?'✓':'—')+' · delta budget '+(2-S.deltas)+'/2 · mint budget '+(2-S.mints)+
      '/2 · <b>cost '+S.cost+'u</b>'+(S.done?' · <b style="color:#16a34a">'+S.done+'</b>':'');
    var bd=document.getElementById('ec-branches'); bd.innerHTML='';
    if(cur){cur.branches.forEach(function(b){
      var btn=document.createElement('button');
      btn.textContent=b.label;
      btn.style.cssText='padding:3px 10px;border-radius:6px;border:1px solid rgba(128,128,128,.4);cursor:pointer;font:inherit;background:transparent;color:inherit';
      btn.onclick=function(){S.cost+=COST[cur.r];trace.push(LBL[cur.r]+' → '+b.label);b.apply();render();};
      bd.appendChild(btn);});}
    document.getElementById('ec-trace').textContent=trace.length?('trace: '+trace.join('  ▸  ')):'click a branch to step the machine (the environment chooses outcomes; the router chooses rules)';
  }
  var ps=document.getElementById('ec-presets');
  [['SEP','SEP'],['REACH','REACH'],['UNSAT','UNSAT']].forEach(function(pr){
    var b=document.createElement('button');b.textContent='start: '+pr[0];
    b.style.cssText='padding:2px 10px;border-radius:6px;border:1px solid rgba(128,128,128,.4);cursor:pointer;font:inherit;background:transparent;color:inherit';
    b.onclick=function(){init(pr[1]);};ps.appendChild(b);});
  document.getElementById('ec-reset').onclick=function(){init(S?S.c:'SEP');};
  init('SEP');
})();
</script>
